<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Итальянские следы в России, Украине и Казахстане</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<style>
  html, body { height:100%; margin:0; font-family: Arial, sans-serif; color:#202124; }
  #map { height:100%; width:100%; }
  .panel { position:absolute; z-index:1000; top:12px; left:12px; max-width:340px; background:rgba(255,255,255,.96); padding:14px 16px; border-radius:10px; box-shadow:0 2px 14px #0002; }
  .panel h1 { font-size:18px; margin:0 0 7px; }
  .panel p { font-size:13px; line-height:1.4; margin:5px 0 10px; }
  .filters { display:flex; flex-wrap:wrap; gap:8px; font-size:13px; }
  .filters label { white-space:nowrap; }
  .legend { margin-top:8px; font-size:12px; color:#555; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:5px; }
  .popup-title { font-weight:700; font-size:15px; margin-bottom:5px; }
  .popup-text { line-height:1.45; max-width:300px; }
  .popup-country { color:#666; font-size:12px; margin-bottom:5px; }
  @media (max-width:600px) { .panel { max-width:calc(100% - 56px); top:8px; left:8px; padding:10px 12px; } .panel h1 {font-size:16px;} }
</style>
</head>
<body>
<div class="panel">
  <h1>Итальянские следы</h1>
  <p>Россия, Украина и Казахстан. Нажмите на метку, чтобы открыть краткую карточку. Положение некоторых меток приблизительное: они обозначают город или район, а не точное место исторического объекта.</p>
  <div class="filters">
    <label><input type="checkbox" id="russia" checked> Россия</label>
    <label><input type="checkbox" id="ukraine" checked> Украина</label>
    <label><input type="checkbox" id="kazakhstan" checked> Казахстан</label>
  </div>
  <div class="legend"><span class="dot" style="background:#b23a48"></span>Архитектура и промышленность&nbsp;&nbsp; <span class="dot" style="background:#246a73"></span>Общины, биографии и история</div>
</div>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const map = L.map('map').setView([49.5, 57], 4);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);

const points = [
 {country:'russia', type:'history', name:'Магадан: итальянцы в Севвостлаге', coords:[59.5682,150.8085], text:'В 1920-е и начале 1930-х годов в СССР приезжали итальянские коммунисты и антифашисты, спасавшиеся от режима Муссолини. Во время Большого террора многих арестовали по обвинениям в шпионаже и антисоветской деятельности. Некоторые были расстреляны, другие отправлены в лагеря; архивные исследования выявили итальянских заключённых в Магаданской области и на Колыме.'},
 {country:'russia', type:'built', name:'Тольятти: ВАЗ и «Жигули»', coords:[53.5078,49.4204], text:'Тольятти назван в августе 1964 года в честь Пальмиро Тольятти, многолетнего руководителя Итальянской коммунистической партии. В 1966 году СССР и FIAT заключили соглашение о строительстве Волжского автомобильного завода; итальянские инженеры и рабочие участвовали в создании предприятия. 19 апреля 1970 года с конвейера сошли первые «Жигули» — советская версия FIAT 124, ставшая одним из самых массовых и узнаваемых автомобилей СССР.'},
 {country:'russia', type:'built', name:'Астрахань', coords:[46.3497,48.0408], text:'Архитекторы Александр Дигби, Луиджи Руска и Карло Депедри упоминаются в истории архитектуры и планировки города. Дигби работал над городским планом в 1786–1803 годах.'},
 {country:'russia', type:'built', name:'Стерлитамак и Уфа', coords:[54.7388,55.9721], text:'Итальянские технологии применялись в советской промышленности: в производстве кальцинированной соды в Стерлитамаке (1967), а также в проектах по выпуску поликарбонатов и полипропилена в Уфе. Требуется уточнение конкретных поставщиков и оборудования.'},
 {country:'russia', type:'history', name:'Белгородская область', coords:[50.5957,36.5873], text:'В январе–феврале 1943 года итальянские войска отступали через районы современной Белгородской области.'},
 {country:'russia', type:'built', name:'Боголюбово', coords:[56.1967,40.5292], text:'С итальянскими мастерами связывают строительство церкви Рождества Богородицы в XII веке. Эту атрибуцию нужно проверять по археологическим публикациям.'},
 {country:'russia', type:'history', name:'Россошь', coords:[50.198,39.568], text:'Итальянские ветераны помогли построить детский сад «Улыбка» в 1993 году. В городе были мемориалы, связанные с итальянскими солдатами и примирением.'},
 {country:'russia', type:'built', name:'Чита и Забайкальская железная дорога', coords:[52.034,113.499], text:'Итальянские братья Франческо и Джованни Занньери участвовали в строительстве мостов Транссибирской железной дороги в районе Читы. Современные названия мостов требуют уточнения.'},
 {country:'russia', type:'built', name:'Кругобайкальская железная дорога', coords:[51.72,103.72], text:'В 1902–1905 годах итальянские каменщики, подрядчики и специалисты по тоннелям участвовали в строительстве дороги. Леонардо Риццолати руководил работами на Ангасольском виадуке; Валентино Флориани и его сыновья работали у мыса Каторжанского; Джованни Карл Андреолетти был подрядчиком тоннельных работ.'},
 {country:'russia', type:'built', name:'Калуга: дом Золотарёва', coords:[54.5138,36.2612], text:'Итальянский скульптор Сантино Кампиони участвовал в создании скульптурного убранства дома купца Золотарёва.'},
 {country:'russia', type:'history', name:'Новороссийск', coords:[44.7239,37.7689], text:'В конце XIX века в городе жила итальянская община. Среди итальянских торговых фирм были Cerruti, Melandino и Apalero. Итальянский капитан Никола Стамбаккьо после кораблекрушения остался в городе и в 1895 году стал членом городской думы.'},
 {country:'russia', type:'history', name:'Красноярск', coords:[56.0153,92.8932], text:'В 1918–1919 годах в Красноярске и Енисейской губернии находились итальянские военнослужащие экспедиционного корпуса. Они участвовали в охране железной дороги и операциях против красных партизан.'},
 {country:'russia', type:'built', name:'Нижний Новгород: кремль', coords:[56.3287,44.002], text:'Итальянский архитектор Пьетро Франческо, известный в России как Пётр Фрязин, участвовал в проектировании и строительстве каменного Нижегородского кремля в 1508–1515 годах.'},
 {country:'russia', type:'history', name:'Омск', coords:[54.9885,73.3242], text:'В 1918–1919 годах при правительстве Колчака пытались организовать итальянскую военную миссию. Во время Первой мировой войны в регионе также находились итальянские военнопленные.'},
 {country:'russia', type:'built', name:'Новочеркасск', coords:[47.4119,40.1042], text:'Итальянский архитектор Луиджи Руска разработал первый проект Вознесенского собора. Итальянский каменотёс Сильвестр Тонитто выполнял мраморные работы для собора и изготовил постамент памятника Ермаку.'},
 {country:'russia', type:'history', name:'Таганрог', coords:[47.2095,38.9351], text:'В 1833 году в Таганроге побывал Джузеппе Гарибальди. В городе установили памятник ему и назвали его именем переулок. На Дону также действовали итальянские торговые фирмы.'},
 {country:'russia', type:'history', name:'Саратов: Гектор Баракки', coords:[51.5336,46.0343], text:'Итальянский художник и педагог Гектор Баракки приехал в Саратов в 1873 году, участвовал в художественной жизни города и обучал молодых художников. Сохранился связанный с ним дом на улице Соляной, 30.'},
 {country:'russia', type:'history', name:'Кадгарон', coords:[43.18,44.27], text:'Уроженец Кадгарона Александр Гиоев во время Второй мировой войны участвовал в итальянском движении Сопротивления. В 2023 году в его родном селении открыли бюст.'},
 {country:'russia', type:'built', name:'Тверь: Императорский путевой дворец', coords:[56.8587,35.9176], text:'Дворец перестраивали при участии Карла Росси, архитектора итальянского происхождения.'},
 {country:'russia', type:'built', name:'Томскнефтехим', coords:[56.4977,84.9744], text:'Итальянские специалисты участвовали в строительстве и запуске Томского нефтехимического комплекса в 1970-х годах. Итальянское оборудование использовалось при производстве полипропилена, запущенном в 1980 году.'},
 {country:'russia', type:'built', name:'Челябинск: тракторный завод', coords:[55.1644,61.4368], text:'В 1929–1933 годах на Челябинском тракторном заводе работали иностранные специалисты, среди которых, по одному исследованию, были и итальянцы. Их имена пока не установлены.'},
 {country:'russia', type:'history', name:'Ярославль: майолика', coords:[57.6261,39.8845], text:'Итальянские мастера упоминаются среди участников распространения технологии майолики в России в петровскую эпоху. Ярославль стал одним из центров производства майолики.'},
 {country:'ukraine', type:'built', name:'Львов', coords:[49.8397,24.0297], text:'Итальянские мастера участвовали в развитии ренессансной архитектуры Львова. Среди известных памятников — Успенская церковь, дом Корнякта и Чёрная каменица.'},
 {country:'ukraine', type:'built', name:'Одесса', coords:[46.4825,30.7233], text:'Архитекторы Франческо Боффо и Джорджо Торричелли участвовали в формировании исторического облика Одессы в первой половине XIX века. Боффо связан с ансамблем Приморского бульвара и Потёмкинской лестницей.'},
 {country:'ukraine', type:'built', name:'Киев', coords:[50.4501,30.5234], text:'Итальянские архитекторы и мастера работали в Киеве в XVI–XVIII веках. В частности, итальянских мастеров связывают с восстановлением Успенской церкви на Подоле и строительством зданий эпохи барокко.'},
 {country:'ukraine', type:'history', name:'Крым и Приазовье', coords:[45.35,36.45], text:'В XIX — начале XX века в Керчи, Феодосии, Мариуполе и Бердянске существовали итальянские общины. Итальянцы занимались торговлей, морским делом, строительством и сельским хозяйством.'},
 {country:'kazakhstan', type:'history', name:'Казахстан: депортация крымских итальянцев', coords:[48.0,67.0], text:'В январе 1942 года советские власти депортировали в Казахстан почти всю итальянскую общину Керчи. Семьи расселяли по сельским районам северного и центрального Казахстана; многие работали в колхозах. Метка показывает условный центр региона расселения, а не точное место.'}
];
const groups = {russia: L.layerGroup().addTo(map), ukraine: L.layerGroup().addTo(map), kazakhstan: L.layerGroup().addTo(map)};
points.forEach(p => {
  const color = p.type === 'built' ? '#b23a48' : '#246a73';
  const marker = L.circleMarker(p.coords, {radius:8, color:'#fff', weight:2, fillColor:color, fillOpacity:0.95});
  marker.bindPopup(`<div class="popup-country">${p.country === 'russia' ? 'Россия' : p.country === 'ukraine' ? 'Украина' : 'Казахстан'}</div><div class="popup-title">${p.name}</div><div class="popup-text">${p.text}</div>`);
  marker.addTo(groups[p.country]);
});
['russia','ukraine','kazakhstan'].forEach(id => document.getElementById(id).addEventListener('change', e => {
  if (e.target.checked) map.addLayer(groups[id]); else map.removeLayer(groups[id]);
}));
</script>
</body>
</html>
